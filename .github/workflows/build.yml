name: Build firmware

# GATED, manual-only.  A full AOSP 8.1 build needs ~100-190 GB disk, >=32 GB RAM
# and many cores; it CANNOT run on a standard GitHub-hosted runner (14 GB disk).
# This workflow therefore runs on a self-hosted or larger runner that YOU provide,
# and is triggered only by hand (workflow_dispatch) so it never fails by accident.
#
# What it does:
#   1. download the baseline firmware (for MTK blobs + private partitions)
#   2. repo sync AOSP 8.1 (r80), apply the U2 patches, link device/vendor trees,
#      extract proprietary blobs, and build (scripts/build.sh --sync --make)
#   3. repack: reuse the official scatter + MTK-private partitions, substitute the
#      freshly built boot/recovery/system, validate against the scatter
#   4. publish the SP_Flash_Tool package to a GitHub Release
#
# The always-on proof that the packaging path works (with the REAL MTK parts and
# placeholder built images) lives in ci.yml -> "Verify & package" job.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label to build on (self-hosted or a larger-runner label)'
        required: true
        default: 'self-hosted'
      build_mode:
        description: 'full = repo sync + whole build; incremental = rebuild only BT modules + snod (needs a persisted tree+out/)'
        required: true
        default: 'full'
        type: choice
        options: ['full', 'incremental']
      workdir:
        description: 'AOSP workdir (empty = auto: full->$RUNNER_TEMP/aosp, incremental->$HOME/u2-aosp persisted)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag (empty = auto: u2-aosp81-<date>-<sha>)'
        required: false
        default: ''
      baseline_url:
        description: 'Baseline firmware zip (source of scatter + MTK-private partitions + blobs)'
        required: true
        default: 'https://github.com/OrientCOMPASS/U2-bt-receiver-firmware/releases/download/base_firmware/B04_35_1.5_8_3inch_M304_ST7701SN_20251016.zip'
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: 'yes'
        type: choice
        options: ['yes', 'no']

permissions:
  contents: write   # create the release + upload the asset

jobs:
  build-and-release:
    name: Build AOSP 8.1 & publish flashable package
    runs-on: ${{ github.event.inputs.runner_label }}
    timeout-minutes: 720
    env:
      BASELINE_URL: ${{ github.event.inputs.baseline_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 8 (AOSP 8.1 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Show build host resources
        run: |
          echo "== cpu ==" ; nproc || true
          echo "== mem ==" ; free -h || true
          echo "== disk ==" ; df -h "$RUNNER_TEMP" . || true
          echo "== java ==" ; java -version 2>&1 || true

      - name: Install build tools (best effort; self-hosted may already have them)
        run: |
          set -e
          if ! command -v repo >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
            chmod a+x "$HOME/bin/repo"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          # debugfs (e2fsprogs) + readelf (binutils) are needed by extract-files.sh
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq e2fsprogs binutils unzip || true
          fi

      - name: Download baseline firmware and extract system.img (full build only)
        if: github.event.inputs.build_mode == 'full'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          echo "[*] downloading baseline (this is ~1.9 GiB)..."
          curl -L --fail -o baseline.zip "$BASELINE_URL"
          unzip -oq baseline.zip
          SYSIMG="$(find "$RUNNER_TEMP" -name system.img -type f | head -1)"
          test -n "$SYSIMG" || { echo "system.img not found in baseline"; exit 1; }
          echo "SYSIMG=$SYSIMG" >> "$GITHUB_ENV"
          ls -la "$SYSIMG"

      - name: Build AOSP 8.1 (full sync+make, or incremental BT modules + snod)
        run: |
          set -e
          MODE="${{ github.event.inputs.build_mode }}"
          WD="${{ github.event.inputs.workdir }}"
          if [ -z "$WD" ]; then
            if [ "$MODE" = "incremental" ]; then WD="$HOME/u2-aosp"; else WD="$RUNNER_TEMP/aosp"; fi
          fi
          echo "WORKDIR=$WD" >> "$GITHUB_ENV"
          if [ "$MODE" = "incremental" ]; then
            echo "[*] incremental rebuild (expects a persisted tree+out/ at $WD)"
            bash scripts/build.sh --workdir "$WD" --incremental --jobs "$(nproc)"
          else
            bash scripts/build.sh --workdir "$WD" --system-image "$SYSIMG" \
                 --sync --make --jobs "$(nproc)"
          fi
          OUT="$WD/out/target/product/u2"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"/system.img "$OUT"/boot.img "$OUT"/recovery.img

      - name: Compute release tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="u2-aosp81-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "[*] release tag: $TAG"

      - name: Repack SP_Flash_Tool package (reuse official scatter + private parts)
        run: |
          set -e
          FW="$RUNNER_TEMP/U2_AOSP81_${TAG}.zip"
          python3 scripts/repack_firmware.py \
            --baseline-url "$BASELINE_URL" \
            --build-out "$OUT" \
            --out "$FW" \
            --pkg-name "U2_AOSP81_${TAG}"
          echo "FW=$FW" >> "$GITHUB_ENV"

      - name: Validate the package against the official scatter
        run: |
          set -e
          CHK="$RUNNER_TEMP/chk"
          rm -rf "$CHK" && mkdir -p "$CHK"
          (cd "$CHK" && unzip -oq "$FW")
          PKGDIR="$CHK/U2_AOSP81_${TAG}"
          SCAT="$(find "$PKGDIR" -name '*_scatter.txt' | head -1)"
          python3 scripts/mtk_scatter.py validate "$SCAT" "$PKGDIR"

      - name: Publish to GitHub Release
        run: |
          set -e
          PRE="--prerelease"
          [ "${{ github.event.inputs.prerelease }}" = "no" ] && PRE=""
          {
            echo "KeenPlus U2 -- AOSP 8.1 Bluetooth-receiver firmware."
            echo
            echo "Flash with SP_Flash_Tool: unzip, load MT6735M_Android_scatter.txt,"
            echo "make sure the partitions are ticked, and use Firmware -> Upgrade"
            echo "(or Download).  This wipes /data -- the Android 7.0 FDE structures"
            echo "are incompatible with 8.1."
            echo
            echo "- system/boot/recovery: built from this repo (AOSP 8.1 + patches)"
            echo "- preloader/lk/logo/secro/trustzone/scatter: reused from the"
            echo "  official baseline (MTK-private; not buildable from AOSP)"
            echo "- commit: ${GITHUB_SHA}"
          } > "$RUNNER_TEMP/notes.md"
          python3 scripts/publish_release.py \
            --tag "$TAG" \
            --name "KeenPlus U2 AOSP 8.1 (${TAG})" \
            --body-file "$RUNNER_TEMP/notes.md" \
            --files "$FW" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            $PRE
