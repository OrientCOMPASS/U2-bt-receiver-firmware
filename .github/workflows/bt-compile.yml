# bt-compile.yml -- standalone compile validation for the patched Bluetooth
# modules.  Proves on a stock GitHub-hosted runner (2-4 cores, 7 GB RAM, 14 GB
# disk) that our patch series actually COMPILES for ARM/bionic, without a full
# AOSP tree (~300 GB).  See docs/INCREMENTAL_BUILD.md for the feasibility
# analysis and scripts/bt_standalone_build.sh for the environment recipe.
#
# NOTE: the uploaded .so/.a artifacts are COMPILE/LINK PROOFS, not flashable
# binaries -- platform shared libraries (libchrome, libcutils, libaudioclient,
# ...) remain undefined symbols to be resolved at runtime on a matching system
# image.  Deployable firmware still comes from build.yml (full 8.1) or the
# Nougat swap plan (docs/NOUGAT_BT_SWAP.md).
name: BT standalone compile

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/bt_standalone_build.sh'
      - 'device/keenplus/u2/bdroid_buildcfg.h'
      - '.github/workflows/bt-compile.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'scripts/bt_standalone_build.sh'
      - 'device/keenplus/u2/bdroid_buildcfg.h'
      - '.github/workflows/bt-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bt-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity (for git am committer)
        run: |
          git config --global user.name  "OrientCOMPASS"
          git config --global user.email "316423573+OrientCOMPASS@users.noreply.github.com"

      - name: Compile patched BT modules in the standalone environment
        shell: bash   # -eo pipefail: script failures must not be masked by `| tee`
        run: |
          chmod +x scripts/bt_standalone_build.sh
          ./scripts/bt_standalone_build.sh \
            --workdir "$RUNNER_TEMP/btenv" \
            --link \
            --jobs "$(nproc)" 2>&1 | tee "$RUNNER_TEMP/bt_build.log"

      - name: Summarize results
        if: always()
        run: |
          echo "### BT standalone compile" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\[build\] result|^\[link\]|undefined_syms' \
            "$RUNNER_TEMP/bt_build.log" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload module artifacts (compile/link proof)
        uses: actions/upload-artifact@v4
        with:
          name: bt-modules-arm-compile-proof
          path: ${{ runner.temp }}/btenv/out/*
          if-no-files-found: error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bt-compile-failure-logs
          path: |
            ${{ runner.temp }}/bt_build.log
            ${{ runner.temp }}/btenv/logs/results.log
            ${{ runner.temp }}/btenv/obj/*.err
          if-no-files-found: ignore
