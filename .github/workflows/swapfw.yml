# --------------------------------------------------------------------------- #
# swapfw.yml -- route ① "nswap": official 7.0 system.img with only the
#               Bluetooth HAL replaced by the 8.1-built bluetooth.default.so.
#
# Pipeline (all in CI, no build machine needed):
#   * baseline zip (release 'base_firmware') -- range-fetch boot.img,
#     recovery.img and the 2.46 GiB sparse system.img (streamed, never in RAM)
#   * boot.img: repack the ramdisk fstab with dm-verity 'verify' removed and
#     re-sign the CMS tail with the AOSP testkey (the key the stock boot is
#     already signed with -- scripts/mtk_bootimg.py, 5/5 unit tests green)
#   * system.img: sparse -> raw -> loop-mount -> swap
#     /system/lib/hw/bluetooth.default.so (SELinux xattr + mode preserved)
#     -> symbol gate (every NEEDED lib and every hard undefined symbol of the
#     8.1 .so must resolve against baseline 7.0 /system libraries)
#     -> e2fsck -> re-sparsify
#   * repack_firmware.py: scatter + MTK-private parts from the baseline
#   * publish to release 'firmware-nswap-v0-<date>' (prerelease)
#
# Manual trigger only (workflow_dispatch).
# --------------------------------------------------------------------------- #
name: nswap-firmware

on:
  workflow_dispatch:
    inputs:
      fw_tag:
        description: 'Release tag to publish the nswap firmware zip under'
        default: 'firmware-nswap-v0-20261028'
        required: true
      pkg_name:
        description: 'Package (folder/zip base) name'
        default: 'U2_7.0_BTswap_v0'
        required: true

env:
  BASELINE_URL: >-
    https://github.com/OrientCOMPASS/U2-bt-receiver-firmware/releases/download/base_firmware/B04_35_1.5_8_3inch_M304_ST7701SN_20251016.zip
  BUILD_RELEASE_TAG: build-8.1.0_r80-eng-20261028
  FW_TAG: ${{ inputs.fw_tag }}
  PKG: ${{ inputs.pkg_name }}
  KERNEL_MD5: 4128dc54373f68008afd1eb6ed25c105

jobs:
  nswap:
    name: Swap BT HAL into 7.0 system & repack boot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tools (cpio, simg, attr, e2fsprogs)
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio android-sdk-libsparse-utils attr e2fsprogs
          cpio --version | head -1
          img2simg 2>&1 | head -1 || true
          getfattr --version | head -1
          df -h "$RUNNER_TEMP" /

      - name: Fetch AOSP testkey pair (stock boot is signed with it)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          for f in testkey.pk8 testkey.x509.pem; do
            curl -fsSL --retry 3 --retry-delay 5 \
              "https://android.googlesource.com/platform/build/+/refs/tags/android-8.1.0_r80/target/product/security/${f}?format=TEXT" \
              | base64 -d > "$RUNNER_TEMP/keys/$f"
          done
          ls -l "$RUNNER_TEMP/keys"
          openssl x509 -in "$RUNNER_TEMP/keys/testkey.x509.pem" -noout -subject

      - name: Download 8.1 bluetooth.default.so from the build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/new"
          rel_json=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$BUILD_RELEASE_TAG")
          id=$(echo "$rel_json" | python3 -c "import json,sys; print(next((a['id'] for a in json.load(sys.stdin)['assets'] if a['name']=='bluetooth.default.so'),0))")
          test "$id" != "0"
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o "$RUNNER_TEMP/new/bluetooth.default.so" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id"
          ls -l "$RUNNER_TEMP/new/bluetooth.default.so"
          md5sum "$RUNNER_TEMP/new/bluetooth.default.so"
          readelf -d "$RUNNER_TEMP/new/bluetooth.default.so" | grep NEEDED

      - name: Stream-extract baseline boot.img + system.img + recovery.img
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/baseline"; mkdir -p "$BASE"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import mtk_fw_zip
          import repack_firmware as rf
          base = os.path.join(os.environ["RUNNER_TEMP"], "baseline")
          rz = mtk_fw_zip.RemoteZip(os.environ["BASELINE_URL"])
          for fn, dest in (("boot.img", "boot.img"),
                           ("system.img", "system.sparse.img")):
              entry = rf.find_entry_by_basename(rz, fn)
              if entry is None:
                  raise FileNotFoundError(f"baseline zip has no {fn}")
              n = rz.extract_stream(entry, os.path.join(base, dest))
              print(f"[nswap] {fn}: {n} bytes", flush=True)
          n = rf.fetch_private(rz, "recovery.img", os.path.join(base, "recovery.img"))
          print(f"[nswap] recovery.img: {n} bytes")
          rz.close()
          PY
          md5sum "$BASE/boot.img"
          ls -l "$BASE"

      - name: Repack boot.img (dm-verity flag removed, re-signed)
        run: |
          set -euo pipefail
          BUILD_OUT="$RUNNER_TEMP/build_out"; mkdir -p "$BUILD_OUT"
          python3 scripts/mtk_bootimg.py disable-verity \
            "$RUNNER_TEMP/baseline/boot.img" "$BUILD_OUT/boot.img" \
            --pk8 "$RUNNER_TEMP/keys/testkey.pk8" \
            --x509 "$RUNNER_TEMP/keys/testkey.x509.pem"
          # the stock kernel must survive byte-identical
          rm -rf "$RUNNER_TEMP/nboot"
          python3 scripts/mtk_bootimg.py unpack "$BUILD_OUT/boot.img" "$RUNNER_TEMP/nboot"
          GOT=$(md5sum "$RUNNER_TEMP/nboot/kernel.bin" | cut -d' ' -f1)
          echo "kernel md5: $GOT (want $KERNEL_MD5)"
          test "$GOT" = "$KERNEL_MD5"
          rm -rf "$RUNNER_TEMP/nboot"

      - name: Convert sparse system to raw
        run: |
          set -euo pipefail
          python3 scripts/mtk_sparse2raw.py \
            "$RUNNER_TEMP/baseline/system.sparse.img" \
            "$RUNNER_TEMP/baseline/system.raw.img" -q
          rm -f "$RUNNER_TEMP/baseline/system.sparse.img"
          ls -l "$RUNNER_TEMP/baseline/system.raw.img"

      - name: Loop-mount, symbol-gate, swap bluetooth.default.so
        run: |
          set -euo pipefail
          NEW="$RUNNER_TEMP/new/bluetooth.default.so"
          sudo mkdir -p /mnt/nswap
          sudo mount -o loop,rw "$RUNNER_TEMP/baseline/system.raw.img" /mnt/nswap
          df -h /mnt/nswap
          OLD=/mnt/nswap/lib/hw/bluetooth.default.so
          if [ ! -f "$OLD" ]; then
            echo "FATAL: baseline HAL .so missing; /system/lib/hw contents:"
            ls /mnt/nswap/lib/hw | head -60
            sudo umount /mnt/nswap; exit 1
          fi
          ls -l "$OLD"
          LABEL=$(sudo getfattr -n security.selinux --only-values "$OLD" 2>/dev/null || true)
          MODE=$(stat -c %a "$OLD")
          echo "[nswap] old mode=$MODE selinux=[$LABEL]"

          # ---- symbol gate (before touching the image) ----
          sudo python3 - "$NEW" /mnt/nswap <<'PY'
          import os, subprocess, sys
          so, mnt = sys.argv[1], sys.argv[2]
          def sh(c):
              return subprocess.run(c, shell=True, capture_output=True, text=True).stdout
          needed = [l.split("[")[-1].split("]")[0]
                    for l in sh(f"readelf -d {so}").splitlines() if "NEEDED" in l]
          libs, missing = {}, []
          for n in needed:
              for d in ("lib", "lib/hw", "vendor/lib", "vendor/lib/hw"):
                  p = os.path.join(mnt, d, n)
                  if os.path.isfile(p):
                      libs[n] = p
                      break
              else:
                  missing.append(n)
          print("[gate] NEEDED:", needed)
          if missing:
              sys.exit(f"[gate] FAIL: NEEDED libs absent from baseline /system: {missing}")
          defined = set()
          for p in libs.values():
              for line in sh(f"readelf --dyn-syms -W {p}").splitlines():
                  parts = line.split()
                  if len(parts) >= 8 and parts[6] != "UND":
                      defined.add(parts[-1])
          hard_missing, weak_missing, total = [], [], 0
          for line in sh(f"readelf --dyn-syms -W {so}").splitlines():
              parts = line.split()
              if len(parts) >= 8 and parts[6] == "UND":
                  total += 1
                  name = parts[-1]
                  if name not in defined:
                      (weak_missing if parts[4] == "WEAK" else hard_missing).append(name)
          if weak_missing:
              print(f"[gate] unresolved WEAK (bind to null at load): {len(weak_missing)}")
              for n in weak_missing[:30]:
                  print("   W", n)
          if hard_missing:
              print(f"[gate] FAIL: {len(hard_missing)} unresolved hard symbols:")
              for n in hard_missing[:80]:
                  print("   U", n)
              sys.exit(f"[gate] FAIL: {len(hard_missing)} unresolved hard symbols")
          print(f"[gate] PASS: {total - len(weak_missing)}/{total} undefined symbols "
                "resolved against baseline /system libs")
          PY

          # ---- swap ----
          sudo cp "$NEW" "$OLD"
          sudo chown root:root "$OLD"
          sudo chmod "$MODE" "$OLD"
          if [ -n "$LABEL" ]; then sudo setfattr -n security.selinux -v "$LABEL" "$OLD"; fi
          GOT=$(md5sum "$OLD" | cut -d' ' -f1)
          WANT=$(md5sum "$NEW" | cut -d' ' -f1)
          echo "[nswap] in-image md5 $GOT (want $WANT)"
          test "$GOT" = "$WANT"
          ls -l "$OLD"
          sync
          sudo umount /mnt/nswap

      - name: e2fsck + re-sparsify system.img
        run: |
          set -euo pipefail
          sudo e2fsck -fn "$RUNNER_TEMP/baseline/system.raw.img" || true
          img2simg "$RUNNER_TEMP/baseline/system.raw.img" "$RUNNER_TEMP/build_out/system.img" 4096
          rm -f "$RUNNER_TEMP/baseline/system.raw.img"
          cp "$RUNNER_TEMP/baseline/recovery.img" "$RUNNER_TEMP/build_out/recovery.img"
          ls -l "$RUNNER_TEMP/build_out"

      - name: Assemble package (scatter + MTK-private parts from baseline)
        run: |
          set -euo pipefail
          python3 scripts/repack_firmware.py \
            --baseline-url "$BASELINE_URL" \
            --build-out "$RUNNER_TEMP/build_out" \
            --out "$RUNNER_TEMP/$PKG.zip" --pkg-name "$PKG"
          ls -l "$RUNNER_TEMP/$PKG.zip"

      - name: Validate the package against the official scatter
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/build_out"
          CHK="$RUNNER_TEMP/chk"; rm -rf "$CHK"; mkdir -p "$CHK"
          (cd "$CHK" && unzip -oq "$RUNNER_TEMP/$PKG.zip")
          SCAT="$(find "$CHK/$PKG" -name '*_scatter.txt' | head -1)"
          python3 scripts/mtk_scatter.py validate "$SCAT" "$CHK/$PKG"
          ls -l "$CHK/$PKG"
          rm -rf "$CHK"

      - name: Publish the nswap firmware zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/NOTES.md" <<'NOTES'
          KeenPlus U2 -- **nswap v0** (route ① / B1 swap): official Android 7.0
          firmware with only the Bluetooth HAL replaced by the AOSP 8.1 build.

          * `system.img`: baseline 7.0 system, `/system/lib/hw/bluetooth.default.so`
            swapped with the 8.1-built HAL (release `build-8.1.0_r80-eng-20261028`,
            carrying system_bt 0001-0005 + hardware/libhardware 0001). SELinux
            label, mode and ownership preserved; fsck clean; re-sparsified.
          * Symbol gate (CI): every NEEDED library and every hard undefined
            symbol of the 8.1 `.so` was verified to resolve against the baseline
            7.0 `/system/lib*` -- see the run log for the gate output.
          * `boot.img`: repacked from the stock image -- ramdisk fstab
            `/system ... ro wait,verify` -> `ro wait` (dm-verity off, required
            because system was modified), kernel byte-identical to stock
            (md5 `4128dc54373f68008afd1eb6ed25c105`), CMS signature tail
            regenerated with the AOSP testkey -- the same public key the stock
            boot is signed with.
          * `recovery.img` and all MTK-private parts (preloader/lk/logo/secro/
            tee/nvram/...): untouched from the official baseline zip.
          * scatter: unmodified official MT6735M scatter; package validated
            against it.

          **Flash:** SP Flash Tool, load the scatter, "Download Only" or
          "Firmware Upgrade". **Rescue:** reflash the official baseline zip the
          same way (never Format; never touch nvram).

          **Caveat:** this release proves the swap pipeline end-to-end and
          should boot to the stock 7.0 home screen with the 8.1 BT HAL loaded
          (watch `logcat -b all | grep -i bluetooth`). Full 8.1 framework
          features remain the goal of route ② (u2 device-target build, v1).
          If the device hangs at the logo, the likely suspect is the
          regenerated boot signature tail (openssl CMS vs lk's expectation);
          a `--no-sign` boot variant is the prepared fallback.
          NOTES
          python3 scripts/publish_release.py \
            --tag "$FW_TAG" --name "U2 nswap v0: 7.0 system + 8.1 BT HAL" \
            --body-file "$RUNNER_TEMP/NOTES.md" --prerelease \
            --files "$RUNNER_TEMP/$PKG.zip"
