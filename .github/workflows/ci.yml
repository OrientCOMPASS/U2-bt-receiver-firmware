name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------- #
  # Fast, offline: structure/lint, generated-file drift, Python unit tests.
  # --------------------------------------------------------------------------- #
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools (shellcheck, xmllint, pyyaml)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck libxml2-utils python3-yaml
          shellcheck --version | head -2
          xmllint --version 2>&1 | head -1

      - name: Structural + lint validation
        run: python3 scripts/validate_repo.py

      - name: Generated vendor makefiles are up to date
        run: python3 scripts/gen-vendor-mk.py --check

      - name: Python unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: shellcheck (all shell scripts)
        run: |
          shellcheck -x \
            scripts/apply-patches.sh \
            scripts/build.sh \
            scripts/measure.sh \
            device/keenplus/u2/extract-files.sh \
            device/keenplus/u2/rootdir/enableswap.sh

      - name: xmllint (all XML well-formed)
        run: |
          find . -name '*.xml' -not -path './.git/*' -print0 \
            | xargs -0 -n1 xmllint --noout

      - name: Byte-compile all Python
        run: python3 -m compileall -q scripts kernel

      - name: CLI smoke tests (--help exits 0)
        run: |
          bash scripts/bt_standalone_build.sh --help >/dev/null
          python3 scripts/make_logo.py --help >/dev/null
          python3 scripts/mtk_sparse2raw.py --help >/dev/null
          python3 scripts/gen-vendor-mk.py --help >/dev/null
          python3 scripts/mtk_scatter.py --help >/dev/null
          python3 scripts/mtk_fw_zip.py --help >/dev/null
          python3 scripts/repack_firmware.py --help >/dev/null
          python3 scripts/publish_release.py --help >/dev/null
          python3 kernel/check-kernel-config.py --help >/dev/null

  # --------------------------------------------------------------------------- #
  # Network: (a) prove every patch series applies to the pristine AOSP 8.1 tag
  # with `git am` on fresh shallow clones; (b) prove the SP_Flash_Tool packaging
  # pipeline works against the REAL baseline -- range-fetch the official scatter +
  # MTK-private partitions (~1 MB, never the 2.46 GiB system), assemble with
  # placeholder built images, and validate against the scatter.  The AOSP compile
  # itself needs a big runner -- see build.yml.
  # --------------------------------------------------------------------------- #
  verify-and-package:
    name: Verify patches & package firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASELINE_URL: >-
        https://github.com/OrientCOMPASS/U2-bt-receiver-firmware/releases/download/base_firmware/B04_35_1.5_8_3inch_M304_ST7701SN_20251016.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity (for git am committer)
        run: |
          git config --global user.name  "OrientCOMPASS"
          git config --global user.email "316423573+OrientCOMPASS@users.noreply.github.com"

      - name: Apply every series to android-8.1.0_r80 (fresh clones)
        run: bash scripts/apply-patches.sh --verify

      - name: Package dry-run vs real baseline (scatter + MTK-private parts)
        run: |
          set -e
          python3 scripts/repack_firmware.py \
            --baseline-url "$BASELINE_URL" --dry-run \
            --out "$RUNNER_TEMP/U2_pkg_dryrun.zip" --pkg-name U2_pkg_dryrun

      - name: Validate the dry-run package against the official scatter
        run: |
          set -e
          CHK="$RUNNER_TEMP/chk"; rm -rf "$CHK"; mkdir -p "$CHK"
          (cd "$CHK" && unzip -oq "$RUNNER_TEMP/U2_pkg_dryrun.zip")
          PKGDIR="$CHK/U2_pkg_dryrun"
          SCAT="$(find "$PKGDIR" -name '*_scatter.txt' | head -1)"
          python3 scripts/mtk_scatter.py validate "$SCAT" "$PKGDIR"
