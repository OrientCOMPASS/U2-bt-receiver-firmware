# --------------------------------------------------------------------------- #
# firmware.yml -- produce the flashable KeenPlus U2 package in CI.
#
# Inputs (release assets, see the build host pipeline):
#   * baseline firmware zip        -- release 'base_firmware' (official 7.0,
#                                     range-fetched: scatter + MTK-private
#                                     partitions + boot/recovery, never the
#                                     2.46 GiB stock system)
#   * system.img.xz                -- release ${{ env.BUILD_RELEASE_TAG }},
#                                     uploaded by the build machine after a
#                                     successful full AOSP 8.1 build
#
# Pipeline:  download -> unpack -> hybrid repack (scripts/repack_firmware.py)
#            -> validate against the official scatter -> publish the zip to
#            release 'firmware-hybrid-v0-<date>' (prerelease).
#
# v0 positioning: baseline (7.0 MTK) boot/recovery + AOSP 8.1 generic-eng
# system carrying the U2 Bluetooth stack.  Flashable layout, validated against
# the official scatter; bootability requires the u2 device-target build (v1).
#
# Manual trigger only (workflow_dispatch) -- one run packages ~2 GiB.
# --------------------------------------------------------------------------- #
name: firmware

on:
  workflow_dispatch:

env:
  BASELINE_URL: >-
    https://github.com/OrientCOMPASS/U2-bt-receiver-firmware/releases/download/base_firmware/B04_35_1.5_8_3inch_M304_ST7701SN_20251016.zip
  BUILD_RELEASE_TAG: build-8.1.0_r80-eng-20261028
  FW_TAG: firmware-hybrid-v0-20261028
  PKG: U2_AOSP81_hybrid_v0

jobs:
  package:
    name: Hybrid repack & publish firmware
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write          # create the release + upload the zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Disk headroom check
        run: df -h "$RUNNER_TEMP" /

      - name: Download system.img.xz from the build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_OUT="$RUNNER_TEMP/build_out"; mkdir -p "$BUILD_OUT"
          ASSET_ID=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$BUILD_RELEASE_TAG" \
            | python3 -c 'import json,sys; print(next(a["id"] for a in json.load(sys.stdin)["assets"] if a["name"]=="system.img.xz"))')
          echo "asset id: $ASSET_ID"
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o "$RUNNER_TEMP/system.img.xz" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          ls -la "$RUNNER_TEMP/system.img.xz"

      - name: Unpack system image; fetch baseline boot/recovery into build_out
        run: |
          set -euo pipefail
          BUILD_OUT="$RUNNER_TEMP/build_out"
          xz -dc "$RUNNER_TEMP/system.img.xz" > "$BUILD_OUT/system.img"
          ls -la "$BUILD_OUT/system.img"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import mtk_fw_zip
          import repack_firmware as rf
          rz = mtk_fw_zip.RemoteZip(os.environ["BASELINE_URL"])
          out = os.path.join(os.environ["RUNNER_TEMP"], "build_out")
          for fn in ("boot.img", "recovery.img"):
              n = rf.fetch_private(rz, fn, os.path.join(out, fn))
              print(f"[fw] baseline {fn}: {n} bytes")
          PY

      - name: Hybrid repack (scatter + MTK-private parts + built system)
        run: |
          set -euo pipefail
          python3 scripts/repack_firmware.py \
            --baseline-url "$BASELINE_URL" \
            --build-out "$RUNNER_TEMP/build_out" \
            --out "$RUNNER_TEMP/$PKG.zip" --pkg-name "$PKG"
          ls -la "$RUNNER_TEMP/$PKG.zip"

      - name: Validate the package against the official scatter
        run: |
          set -euo pipefail
          # free the intermediates we no longer need before unzipping
          rm -f "$RUNNER_TEMP/system.img.xz" "$RUNNER_TEMP/build_out/system.img"
          CHK="$RUNNER_TEMP/chk"; rm -rf "$CHK"; mkdir -p "$CHK"
          (cd "$CHK" && unzip -oq "$RUNNER_TEMP/$PKG.zip")
          SCAT="$(find "$CHK/$PKG" -name '*_scatter.txt' | head -1)"
          python3 scripts/mtk_scatter.py validate "$SCAT" "$CHK/$PKG"
          rm -rf "$CHK"

      - name: Publish the firmware zip to its own release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/NOTES.md" <<NOTES
          KeenPlus U2 -- AOSP 8.1 hybrid firmware **v0 (engineering)**.

          * system.img: AOSP \`android-8.1.0_r80\` \`aosp_arm-eng\` build from the
            U2 build machine (release \`$BUILD_RELEASE_TAG\`), carrying the full
            U2 patch series: system_bt 0001-0005 (A2DP AAC sink + pie decoder
            backport + SBC/AAC dispatch + SBC-XQ bitpool + SINK_AAC switches),
            hardware/libhardware 0001 (BTAV_A2DP_CODEC_INDEX_SINK_AAC).
          * boot.img / recovery.img / preloader / lk / logo / secro / tee /
            cache / userdata: reused from the official baseline
            (B04_35_1.5_8_3inch_M304_ST7701SN_20251016).
          * scatter: unmodified official MT6735M scatter; package validated
            against it (completeness + partition sizes).

          **v0 caveat:** 7.0 MTK boot/recovery + 8.1 generic-eng system.
          Flashable via SP_Flash_Tool (firmware update) for layout/content
          verification; a bootable daily image requires the v1 u2
          device-target build (prebuilt kernel + matching 8.1 ramdisk).
          NOTES
          python3 scripts/publish_release.py \
            --tag "$FW_TAG" --name "U2 AOSP 8.1 hybrid firmware v0 (engineering)" \
            --body-file "$RUNNER_TEMP/NOTES.md" --prerelease \
            --files "$RUNNER_TEMP/$PKG.zip"
