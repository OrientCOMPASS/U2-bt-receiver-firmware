# baseline-probe.yml -- milestone B1 of docs/NOUGAT_BT_SWAP.md: dissect the
# official baseline firmware's system.img WITHOUT root/loop mounts, using the
# pure-stdlib ext4+ELF reader in scripts/baseline_probe.py.
#
# Produces:
#   * report.json      -- exact Android version, BT file inventory, ELF
#                         DT_NEEDED/SONAME/symbol stats, dependency closure
#   * symbols/*.txt    -- undefined/exported symbol dumps (input for the B3
#                         true-link symbol-coverage check)
#   * extracted/**     -- build.prop, BT modules, APK, firmware, and every
#                         library in the DT_NEEDED closure (the actual device
#                         .so files we will link against in B3)
name: Baseline probe (B1)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/baseline_probe.py'
      - 'scripts/tests/test_baseline_probe.py'
      - '.github/workflows/baseline-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE_URL: https://github.com/OrientCOMPASS/U2-bt-receiver-firmware/releases/download/base_firmware/B04_35_1.5_8_3inch_M304_ST7701SN_20251016.zip

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official baseline firmware zip (~1.9 GB)
        shell: bash
        run: |
          curl -sSL --retry 3 -o "$RUNNER_TEMP/base.zip" "$BASELINE_URL"
          ls -la "$RUNNER_TEMP/base.zip"

      - name: Probe system.img (pure-python ext4 + ELF32)
        shell: bash
        run: |
          python3 scripts/baseline_probe.py \
            --zip "$RUNNER_TEMP/base.zip" \
            --outdir "$RUNNER_TEMP/probe" \
            -v 2>&1 | tee "$RUNNER_TEMP/probe.log"

      - name: Summarize report
        if: always()
        shell: bash
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "probe", "report.json")
          print("### Baseline probe (B1)")
          if not os.path.exists(p):
              print("report.json missing -- probe did not finish")
              raise SystemExit(0)
          r = json.load(open(p))
          v = r.get("version", {})
          print("\n| key | value |\n|---|---|")
          for k in sorted(v):
              print(f"| {k} | `{v[k]}` |")
          inv = r.get("inventory", {})
          print(f"\nfiles={inv['counts']['files']} dirs={inv['counts']['dirs']} "
                f"bt_files={len(inv['bt_files'])} libs={len(inv['lib_names'])} "
                f"vendor_libs={len(inv['vendor_lib_names'])} fw={len(inv['firmware'])}")
          print("\n**BT-related files:**\n")
          for b in inv.get("bt_files", []):
              print(f"- `{b['path']}` ({b['size']:,} B, {b['why']})")
          print("\n**ELF closure (seed modules):**\n")
          print("| path | SONAME | needed | exported | undefined |")
          print("|---|---|---|---|---|")
          for path, info in sorted(r.get("elf", {}).items()):
              if path.startswith("(") or info.get("missing"):
                  continue
              if "hw/" in path or "bluetooth" in path.lower() or "bt" in os.path.basename(path):
                  print(f"| `{path}` | {info.get('soname')} | "
                        f"{len(info.get('needed', []))} | {info.get('n_exported')} | "
                        f"{info.get('n_undefined')} |")
          unres = [k for k in r.get("elf", {}) if k.startswith("(")]
          if unres:
              print("\nUnresolved sonames: " + ", ".join(f"`{u[12:]}`" for u in unres))
          PYEOF

      - name: Upload probe report + symbol tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-probe-report
          path: |
            ${{ runner.temp }}/probe/report.json
            ${{ runner.temp }}/probe/symbols/**
          if-no-files-found: warn

      - name: Upload extracted baseline BT files + dependency libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-bt-extracted
          path: ${{ runner.temp }}/probe/extracted/**
          if-no-files-found: warn

      - name: Upload probe log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-probe-log
          path: ${{ runner.temp }}/probe.log
          if-no-files-found: ignore
