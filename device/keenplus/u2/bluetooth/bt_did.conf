# bt_did.conf -- Bluetooth Device ID (DID) record for the KeenPlus U2.
#
# The DID record is what a peer sees in SDP; it drives the icon/name shown on
# phones.  vendorIdSource: 0x0001 = Bluetooth SIG, 0x0002 = USB Implementers
# Forum.  The values below are placeholders -- replace vendorId/productId with
# the IDs assigned to the product before shipping (a SIG vendor ID requires
# membership; otherwise use the USB source with the company's USB VID).

vendorIdSource = 0x0002
vendorId  = 0x1234
productId = 0x0002
version   = 1.0

# primaryRecord: advertise this as the primary DID record.
primaryRecord = true
