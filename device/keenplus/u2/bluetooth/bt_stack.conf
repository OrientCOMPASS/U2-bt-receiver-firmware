# bt_stack.conf -- KeenPlus U2 (AOSP 8.1 Bluetooth stack)
#
# The baseline shipped an MTK-flavoured bt_stack.conf with a [MtkBtConf]
# MtkStackConfigOverride=/sdcard/btsc hook and an [MtkBtFWLog] vendor-HCI block
# (plan section 2.3).  Those MTK extensions belong to the MTK stack; with the
# AOSP 8.1 stack the override hook is not honoured, so runtime tuning is done via
# setprop / a re-flash instead.  Trace levels are kept low for a shipping build.

# BtSnoop logging off by default (turn on for debugging only).
BtSnoopLogOutput=false
BtSnoopFileName=/sdcard/mtklog/btlog/btsnoop_hci.log
BtSnoopSaveLog=false

# Stack trace configuration (kept modest; raise for field debugging).
TraceConf=true
TRC_BTM=2
TRC_HCI=2
TRC_L2CAP=2
TRC_RFCOMM=2
TRC_OBEX=2
TRC_AVCT=2
TRC_AVDT=2
TRC_AVRC=2
TRC_AVDT_SCB=2
TRC_AVDT_CCB=2
TRC_A2D=2
TRC_SDP=2
TRC_SMP=2
TRC_BTAPP=2
TRC_BTIF=2
TRC_GAP=2

# ---- MTK controller firmware-log vendor HCI (retained for reference) ----
# These were applied by the MTK stack at init.  With the AOSP stack they are
# informational; the equivalent is achieved through the wmt/MT6627 tooling.
# C1 = 01 BE FC 01 00   # vendor HCI: controller FW log OFF (05 = ON)
